<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorQuest - Login Failed</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="bootstrap.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .login-failed-container {
            max-width: 400px;
            margin: 0 auto;
            margin-top: 100px;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            color: #333;
            text-align: center;
        }

        .login-failed-header {
            color: #ff0000;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .login-reasons {
            text-align: left;
            margin-top: 30px;
            font-size: 18px;
        }

        .login-reasons ul {
            list-style-type: disc;
            margin-left: 20px;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body style="background-image: url('img/page2.jpg');">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 login-failed-container">
                <div class="login-failed-header">
                    <p>Sign Up Failed!</p>
                </div>
                <p>Sorry, the provided credentials are incorrect. Please check the following reasons:</p>
                <div class="login-reasons">
                    <ul>
                        <li>Incorrect password.</li>
                        <li>There is already an account exist with this email.</li>
                        
                    </ul>
                </div>
                <div class="d-grid gap-2 mt-4">
                    <a href="signUpUser.html" class="btn btn-primary">Try Again</a>
                    <a href="homePage.html" class="btn btn-secondary">Home Page</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
