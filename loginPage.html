<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorQuest - Login</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="bootstrap.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f1f1f1;
            font-family: Arial, sans-serif;
        }

        .login-container {
            max-width: 400px;
            margin: 0 auto;
            margin-top: 100px;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #007bff;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #777;
            font-size: 14px;
            margin-bottom: 0;
        }

        .form-label {
            font-weight: bold;
            color: #444;
        }

        .form-control {
            border: 2px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: none;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .form-check-label {
            color: #666;
        }

        .sign-up-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .sign-up-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body style="background-image: url('img/page2.jpg');">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 login-container">
                <div class="login-header">
                    <h2>TutorQuest</h2>
                    <p>Welcome back! Please log in to your account.</p>
                </div>
                <form action="loginPage.php" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username or Email</label>
                        <input type="text" class="form-control" id="username" name="loginUsername" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="loginPassword" required>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                    </div>
                    <div class="text-center mt-3">
                        <a href="#">Forgot Password?</a>
                    </div>
                    
                </form>
                <div class="text-center mt-4">
                    <span>New here? </span>
                    <a href="signUpUser.html" class="sign-up-link">Sign Up</a>
                </div>
                <div class="text-center mt-4">
                    <a href="homePage.html" class="btn btn-secondary">Homepage</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
